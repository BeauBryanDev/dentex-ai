name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          ## torch must come from the CPU index or pip pulls ~3 GB of CUDA wheels.
          ## The pin carries a +cpu local version, which PyPI cannot resolve.
          pip install torch==2.13.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run unit tests
        ## pytest.ini pins testpaths to tests/unit, so the paid eval harnesses are never
        ## collected. No ANTHROPIC_API_KEY secret is needed, conftest stubs one.
        run: pytest
